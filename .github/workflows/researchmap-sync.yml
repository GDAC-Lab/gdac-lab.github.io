# Refresh _publications from researchmap and the preprint sources, commit to
# master if anything changed, and then deploy.
#
# The deploy has to be asked for: GitHub does not start a workflow from a push
# made with the default GITHUB_TOKEN, so the commit this job creates would never
# trigger deploy.yml on its own. workflow_dispatch is the documented exception
# to that rule, so the last step dispatches deploy.yml — and only when something
# was actually pushed, so a quiet week does not rebuild the site for nothing.
#
# Note on the schedule: GitHub disables a scheduled workflow after 60 days
# without repository activity, and that is exactly what happened here — the
# sync went `disabled_inactivity` on 2026-07-06 and stopped running for two
# months without any failure notice. The heartbeat step commits a timestamp
# whenever the repository has been quiet for a month, so the 60-day timer cannot
# run out. If it is ever disabled again, re-enable it under Actions.
name: Researchmap publication sync

on:
  schedule:
    # Weekly: Monday 00:00 UTC (09:00 JST).
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: researchmap-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the refreshed publication files
      actions: write    # dispatch deploy.yml afterwards
    env:
      # Puts the requests in Crossref's and DataCite's polite pools. Set under
      # Settings → Secrets and variables → Actions → Variables.
      CROSSREF_CONTACT_EMAIL: ${{ vars.CROSSREF_CONTACT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test the sync scripts offline
        run: python3 scripts/test_pubsync.py

      # A failure here stops the job: there is nothing to commit and nothing to
      # deploy, and the site keeps the list it already has.
      - name: Fetch publications from researchmap
        run: python3 scripts/fetch_researchmap_publications.py satoshi-nakano

      # The script exits non-zero only when a preprint could not be resolved
      # from any source AND there was no existing entry to carry forward — the
      # one case where the site is actually missing something. An outage that
      # loses nothing is a warning on the run. Either way the researchmap
      # result above must still be committed, hence continue-on-error and the
      # report at the end.
      - name: Resolve preprints (arXiv, DataCite, Crossref)
        id: preprints
        continue-on-error: true
        run: python3 scripts/sync_preprints_from_sources.py

      - name: Heartbeat when the repository has been quiet
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit was ${age_days} day(s) ago."
          if [ "$age_days" -ge 30 ]; then
            mkdir -p _data
            printf '{\n  "last_sync_utc": "%s"\n}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              > _data/publication_sync.json
            echo "Wrote heartbeat to keep the schedule from being auto-disabled."
          fi

      # -A stages deletions: a paper removed from researchmap, or renamed by a
      # date correction, must leave the site too.
      - name: Commit and push if anything changed
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _publications _data
          if git diff --staged --quiet; then
            echo "No publication file changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --staged --name-status
          git commit -m "chore: sync publications (researchmap + preprints)"
          git push origin HEAD:master
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the refreshed publication files
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master

      - name: Report a preprint that is missing from the site
        if: steps.preprints.outcome == 'failure'
        run: |
          echo "::error::A preprint could not be resolved from any source and nothing was on file to fall back on; it is missing from the site. See the preprint step above."
          echo "The researchmap result was still committed and deployed."
          exit 1
