# Refresh _publications from researchmap and the preprint sources, rebuild the
# English CV's publication lists in _cv/, commit to master if anything changed,
# deploy, and copy the CV lists into the CV's Overleaf project.
#
# The deploy has to be asked for: GitHub does not start a workflow from a push
# made with the default GITHUB_TOKEN, so the commit this job creates would never
# trigger deploy.yml on its own. workflow_dispatch is the documented exception
# to that rule, so the job dispatches deploy.yml — and only when a file the site
# is built from changed, so a quiet week does not rebuild the site for nothing.
#
# Note on the schedule: GitHub disables a scheduled workflow after 60 days
# without repository activity, and that is exactly what happened here — the
# sync went `disabled_inactivity` on 2026-07-06 and stopped running for two
# months without any failure notice. The heartbeat step commits a timestamp
# whenever the repository has been quiet for a month, so the 60-day timer cannot
# run out. If it is ever disabled again, re-enable it under Actions.
name: Researchmap publication sync

on:
  schedule:
    # Weekly: Monday 00:00 UTC (09:00 JST).
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: researchmap-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the refreshed publication files
      actions: write    # dispatch deploy.yml afterwards
    env:
      # Puts the requests in Crossref's and DataCite's polite pools. Set under
      # Settings → Secrets and variables → Actions → Variables.
      CROSSREF_CONTACT_EMAIL: ${{ vars.CROSSREF_CONTACT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test the sync scripts offline
        run: python3 scripts/test_pubsync.py

      # A failure here stops the job: there is nothing to commit and nothing to
      # deploy, and the site keeps the list it already has.
      - name: Fetch publications from researchmap
        run: python3 scripts/fetch_researchmap_publications.py satoshi-nakano

      # The script exits non-zero only when a preprint could not be resolved
      # from any source AND there was no existing entry to carry forward — the
      # one case where the site is actually missing something. An outage that
      # loses nothing is a warning on the run. Either way the researchmap
      # result above must still be committed, hence continue-on-error and the
      # report at the end.
      - name: Resolve preprints (arXiv, DataCite, Crossref)
        id: preprints
        continue-on-error: true
        run: python3 scripts/sync_preprints_from_sources.py

      # _cv/journals.bib and _cv/proceedings.bib for the English CV: researchmap
      # says which papers, Crossref describes them. A failure keeps last week's
      # files and must not hold back the publication list above.
      - name: Build the CV bibliography
        id: cv
        continue-on-error: true
        run: python3 scripts/build_cv_bib.py satoshi-nakano

      - name: Heartbeat when the repository has been quiet
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit was ${age_days} day(s) ago."
          if [ "$age_days" -ge 30 ]; then
            mkdir -p _data
            printf '{\n  "last_sync_utc": "%s"\n}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              > _data/publication_sync.json
            echo "Wrote heartbeat to keep the schedule from being auto-disabled."
          fi

      # -A stages deletions: a paper removed from researchmap, or renamed by a
      # date correction, must leave the site too.
      - name: Commit and push if anything changed
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _publications _data _cv
          if git diff --staged --quiet; then
            echo "No publication file changes."
            exit 0
          fi
          git diff --staged --name-status
          git commit -m "chore: sync publications (researchmap, preprints, CV bibliography)"
          git push origin HEAD:master
          # _cv/ is not part of the site; a change there alone needs no rebuild.
          if git diff --name-only HEAD~1 HEAD | grep -qv '^_cv/'; then
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the refreshed publication files
        if: steps.push.outputs.site_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master

      # Copy the two .bib files into the CV's Overleaf project, as
      # generated/journals.bib and generated/proceedings.bib, through Overleaf's
      # git bridge. Only those two paths are ever staged, so nothing else in the
      # project is touched, and nothing is committed when they are unchanged.
      # Skipped until both secrets exist (Settings → Secrets and variables →
      # Actions). The credential helper hands git the token when it asks; the
      # token is never written into a URL, a file or the log. The copy on
      # GitHub is already committed by now, so a failure here is reported at
      # the end rather than stopping the job.
      - name: Copy the CV bibliography into Overleaf
        id: overleaf
        continue-on-error: true
        env:
          OVERLEAF_GIT_TOKEN: ${{ secrets.OVERLEAF_GIT_TOKEN }}
          OVERLEAF_CV_PROJECT_ID: ${{ secrets.OVERLEAF_CV_PROJECT_ID }}
        run: |
          if [ -z "$OVERLEAF_GIT_TOKEN" ] || [ -z "$OVERLEAF_CV_PROJECT_ID" ]; then
            echo "::notice::OVERLEAF_GIT_TOKEN / OVERLEAF_CV_PROJECT_ID are not set; the CV bibliography was not copied to Overleaf."
            exit 0
          fi
          helper='!f() { echo username=git; echo "password=$OVERLEAF_GIT_TOKEN"; }; f'
          og() { git -c credential.helper="$helper" "$@"; }
          og clone --quiet "https://git.overleaf.com/$OVERLEAF_CV_PROJECT_ID" "$RUNNER_TEMP/cv"
          cd "$RUNNER_TEMP/cv"
          # The commit, and the rebase below if it comes to that, need a name.
          git config user.name "GDAC Lab publication sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p generated
          cp "$GITHUB_WORKSPACE/_cv/journals.bib" "$GITHUB_WORKSPACE/_cv/proceedings.bib" generated/
          git add generated/journals.bib generated/proceedings.bib
          if git diff --cached --quiet; then
            echo "Overleaf already has the current lists."
            exit 0
          fi
          git diff --cached --stat
          git commit --quiet -m "Update the publication lists from researchmap"
          # Someone may have edited the CV between the clone and now; our two
          # files cannot conflict with that, so rebase once and push again.
          og push --quiet origin HEAD || { og pull --rebase --quiet origin HEAD && og push --quiet origin HEAD; }
          echo "Copied to Overleaf: generated/journals.bib, generated/proceedings.bib"

      - name: Report what did not go through
        if: ${{ !cancelled() && (steps.preprints.outcome == 'failure' || steps.cv.outcome == 'failure' || steps.overleaf.outcome == 'failure') }}
        run: |
          if [ "${{ steps.preprints.outcome }}" = "failure" ]; then
            echo "::error::A preprint could not be resolved from any source and nothing was on file to fall back on; it is missing from the site. See the preprint step above."
          fi
          if [ "${{ steps.cv.outcome }}" = "failure" ]; then
            echo "::error::The CV bibliography could not be rebuilt; last week's _cv/*.bib were kept. See the CV step above."
          fi
          if [ "${{ steps.overleaf.outcome }}" = "failure" ]; then
            echo "::error::The CV bibliography could not be copied into Overleaf; _cv/ on GitHub is unaffected. If the Overleaf step reports an authentication failure, the token was revoked or has expired: create a new one in Overleaf and replace the OVERLEAF_GIT_TOKEN secret."
          fi
          echo "The researchmap result was still committed and deployed."
          exit 1
