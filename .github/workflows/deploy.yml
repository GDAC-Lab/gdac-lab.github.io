# Build the site and publish _site to the plesk-deploy branch, from which the
# NITech Plesk host is pulled by hand.
#
# Runs on every push to master, and when researchmap-sync.yml dispatches it
# after committing refreshed publication files. It builds exactly what is
# committed: the publication lists are fetched by researchmap-sync.yml, not
# here, so a deploy never waits on researchmap, arXiv or DataCite and cannot
# fail because one of them is down.
name: Build and Deploy to Plesk

on:
  push:
    branches:
      - master
  workflow_dispatch:

# One build at a time, in commit order. A newer push supersedes a run that is
# still queued, never one that is already writing plesk-deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # bundler-cache runs `bundle install` against Gemfile.lock and caches the
      # result, so there is nothing more to install before the build.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      # LANG matters: several SCSS partials carry Japanese comments, and Jekyll's
      # SCSS converter aborts on them under a US-ASCII locale. ubuntu-latest
      # happens to default to C.UTF-8, so this only makes the requirement
      # explicit rather than depending on the runner image (see README).
      - name: Build the site
        env:
          LANG: C.UTF-8
        run: bundle exec jekyll build

      # /nakano/ on the live server is a WordPress site that this repository does
      # not build and must not touch. The two coexist only because Plesk's git
      # deploy leaves files it does not know about in place -- but an index.html
      # written there would be served ahead of WordPress's index.php and would
      # silently replace that site with a blank Jekyll page. Nothing creates one
      # today; this is here so that nothing ever does by accident.
      - name: Refuse to publish anything at /nakano/
        run: |
          if [ -e _site/nakano ]; then
            echo "::error title=/nakano/ would be overwritten::The build produced _site/nakano, but on the server that path is a separate WordPress site. Remove whatever page or permalink creates it before deploying."
            exit 1
          fi

      - name: Publish _site to the plesk-deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: plesk-deploy
