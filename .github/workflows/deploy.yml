name: Build and Deploy to Plesk
on:
  push:
    branches:
      - master # リポジトリのメインブランチが main の場合は main に書き換えてください
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The publication list is refreshed from researchmap and arXiv/Crossref on
      # every deploy, but the committed _publications/ files are already a
      # complete list (the weekly researchmap-sync workflow keeps them current).
      # An outage at one of those services must not stop the rest of the site
      # from going out: record the outcome, build from what is committed, and
      # flag it in the run summary below.
      - name: Fetch publications from researchmap
        id: researchmap
        continue-on-error: true
        run: python3 scripts/fetch_researchmap_publications.py satoshi-nakano

      - name: Sync preprints (DOI / arXiv from _data/preprint_sources.json)
        id: preprints
        continue-on-error: true
        run: python3 scripts/sync_preprints_from_sources.py
        env:
          CROSSREF_CONTACT_EMAIL: ${{ vars.CROSSREF_CONTACT_EMAIL }}

      - name: Note a failed publication fetch
        if: steps.researchmap.outcome == 'failure' || steps.preprints.outcome == 'failure'
        run: |
          if [ "${{ steps.researchmap.outcome }}" = "failure" ]; then
            echo "::warning title=researchmap fetch failed::The site was built from the committed publication list. See the step log; the weekly sync will retry."
          fi
          if [ "${{ steps.preprints.outcome }}" = "failure" ]; then
            echo "::warning title=Preprint sync failed::The site was built from the committed preprint entries. See the step log; the weekly sync will retry."
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      # LANG matters: several SCSS partials carry Japanese comments, and Jekyll's
      # SCSS converter aborts on them under a US-ASCII locale. ubuntu-latest
      # happens to default to C.UTF-8, so this only makes the requirement
      # explicit rather than depending on the runner image (see README).
      - name: Build Jekyll site
        env:
          LANG: C.UTF-8
        run: |
          gem install bundler
          bundle install
          bundle exec jekyll build

      # /nakano/ on the live server is a WordPress site that this repository does
      # not build and must not touch. The two coexist only because Plesk's git
      # deploy leaves files it does not know about in place -- but an index.html
      # written there would be served ahead of WordPress's index.php and would
      # silently replace that site with a blank Jekyll page. Nothing creates one
      # today; this is here so that nothing ever does by accident.
      - name: Refuse to publish anything at /nakano/
        run: |
          if [ -e _site/nakano ]; then
            echo "::error title=/nakano/ would be overwritten::The build produced _site/nakano, but on the server that path is a separate WordPress site. Remove whatever page or permalink creates it before deploying."
            exit 1
          fi

      - name: Deploy to plesk-deploy branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: plesk-deploy
