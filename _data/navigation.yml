# The order of the links in the header.
#
# Removing a link here only takes it out of the header; the page itself stays on
# the site. One page is deliberately absent: /terms/, which is linked from the
# footer, where a reader looks for it.
#
# An entry with `children:` becomes a menu instead of a link. The parent is not
# itself a link — it opens the menu — so whatever page it would have pointed at
# has to appear as the first child. The children are ordinary <a> elements in
# the markup of every page whether the menu is open or not, so they are links a
# search engine follows, not something JavaScript conjures up.
#
# The order also decides what survives a narrow window: the masthead keeps as
# many items as fit and moves the rest into the overflow menu, from the end, so
# anything put last is the first to disappear on a small laptop.

main:
  - title: "Research"
    title_ja: "研究内容"
    children:
      - title: "Overview"
        title_ja: "研究の概要"
        url: /research/
      - title: "Simulator"
        title_ja: "シミュレータ"
        url: /simulator/
      - title: "A satellite that avoids the Sun"
        title_ja: "太陽を避ける人工衛星"
        url: /sun-safe-slew/

  - title: "Publications"
    title_ja: "論文"
    url: /publications/

  - title: "People"
    title_ja: "メンバー"
    url: /people/

  - title: "Lab policy"
    title_ja: "運営方針"
    url: /policy/

  - title: "Facilities"
    title_ja: "実験装置"
    url: /facilities/

  - title: "Access"
    title_ja: "アクセス"
    url: /access/
