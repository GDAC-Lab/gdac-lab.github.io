# 実験装置・設備ギャラリー（/facilities/ ・ /ja/facilities/）
# Equipment and facilities gallery. Rendered by _includes/facility-gallery.html.
#
# 写真を追加する手順 / How to add a photo
#   1. 画像を images/facilities/ に置きます。
#      横 1424 × 縦 1068（4:3）の JPEG（品質 80 前後）を目安にしてください。ギャラリーは 4:3 の枠で
#      表示するので，元の写真をその比率に切り抜いておくと意図した構図で表示されます。
#   2. 下の該当する項目に image: を書きます。images/ からの相対パスです。
#        image: "facilities/wheeled-drone.jpg"
#   3. width: / height: に画像の実寸を入れます。読み込み中のガタつきを防ぐためのものです。
#   4. alt_ja: / alt_en: に，写真に何が写っているかを一文で書きます。
#
#   image: が空の項目は「写真準備中」のカードとして表示されます。項目そのものを消す必要はありません。
#   An item with no `image` renders as a "photo coming soon" card, so the list can be
#   filled in one photo at a time.
#
# 項目を増やすとき / To add an item
#   items: の末尾に，下のテンプレート（コメントアウトしてあります）をコピーして使ってください。
#   並び順はこのファイルの順序がそのまま表示順になります。
#
# 現在の写真は研究室ブログ（https://gdaclab.blogspot.com/）の 2026 年 5 月の記事から取り込んだものです。

items:
  - id: wheeled-drone
    title_ja: "車輪付きドローン"
    title_en: "Wheeled drone"
    body_ja: "ドローンの両側に車輪を取り付けた機体です。壁や天井に押し付けて車輪で走行でき，壁のそばや狭い空間でも姿勢を保てます。"
    body_en: "A drone with a wheel on each side. Pressed against a wall or ceiling it travels on its wheels, and it holds its attitude close to walls and in narrow spaces."
    image: "facilities/wheeled-drone.jpg"
    width: 1424
    height: 1068
    alt_ja: "床に置かれた車輪付きドローン。左右に大きな車輪が付いている"
    alt_en: "A wheeled drone on the floor, with a large wheel on each side"

  - id: quadrotors
    title_ja: "研究用ドローン（QAV250）"
    title_en: "Research drones (QAV250)"
    body_ja: "制御対象として用いている QAV250 ベースのドローンです。モーションキャプチャ用のマーカを取り付けて飛行させます。"
    body_en: "QAV250-based drones used as the controlled vehicles. They fly with motion-capture markers attached."
    image: "facilities/quadrotors-qav250.jpg"
    width: 1424
    height: 1068
    alt_ja: "送信機と，マーカを付けた数機の QAV250 ドローン"
    alt_en: "A transmitter and several QAV250 drones fitted with motion-capture markers"

  - id: stampfly
    title_ja: "小型ドローン（StampFly）"
    title_en: "Small drone (StampFly)"
    body_ja: "重さ約 37 g の小型ドローン StampFly です。手のひらに載る大きさで，屋内の実験に用いています。"
    body_en: "StampFly, a small drone weighing about 37 g. It fits in the palm of a hand and is used for indoor experiments."
    image: "facilities/stampfly.jpg"
    width: 1424
    height: 1068
    alt_ja: "手のひらに載せた小型ドローン StampFly"
    alt_en: "The StampFly small drone resting in a palm"

  - id: experiment-room
    title_ja: "実験室"
    title_en: "Experiment room"
    body_ja: "山田研究室と共同で使用している実験室です。モーションキャプチャのカメラを備え，ドローンの飛行実験を行います。"
    body_en: "The experiment room shared with the Yamada Laboratory. It is equipped with motion-capture cameras and is where the drones fly."
    image: "facilities/experiment-room.jpg"
    width: 1424
    height: 1068
    alt_ja: "黒い幕とモーションキャプチャカメラに囲まれた実験室の飛行スペース"
    alt_en: "The flight space of the experiment room, ringed by black curtains and motion-capture cameras"

  - id: motion-capture
    title_ja: "モーションキャプチャ"
    title_en: "Motion capture"
    body_ja: "Vicon と Qualisys の 2 種類のモーションキャプチャを，用途に応じて使い分けています。機体の位置と姿勢を計測し，制御に用います。"
    body_en: "Two motion-capture systems, Vicon and Qualisys, are used depending on the experiment. They measure the position and attitude of the vehicles for control."
    image: "facilities/motion-capture-vicon.jpg"
    width: 1424
    height: 1068
    alt_ja: "天井のレールに取り付けられた Vicon のモーションキャプチャカメラ"
    alt_en: "A Vicon motion-capture camera mounted on a ceiling rail"

  - id: thrust-stand
    title_ja: "推力試験機"
    title_en: "Thrust test stand"
    body_ja: "ロータの推力と反トルクを，電圧・電流に対して計測する試験機です。力覚センサには Leptrino 製のものを用いています。"
    body_en: "A stand that measures rotor thrust and reaction torque against voltage and current, using a Leptrino force sensor."
    image: "facilities/thrust-test-stand.jpg"
    width: 1424
    height: 1068
    alt_ja: "アルミフレームの推力試験機に固定されたドローン"
    alt_en: "A drone fixed to the aluminum-frame thrust test stand"

  - id: printers
    title_ja: "3D プリンタ"
    title_en: "3D printers"
    body_ja: "機体の部品を製作するための 3D プリンタです。3 機を用途に応じて使い分けています。"
    body_en: "3D printers for making airframe parts. Three machines are used according to the job."
    image: "facilities/3d-printers.jpg"
    width: 1424
    height: 1068
    alt_ja: "実験室に置かれた 3D プリンタ"
    alt_en: "One of the 3D printers in the experiment room"

