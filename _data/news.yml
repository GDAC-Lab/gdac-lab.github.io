# News / お知らせ (shown on EN and JA home pages, newest first).
# Fields per item:
#   date: YYYY-MM-DD (required for display)
#   title, title_en, title_ja: all optional (short items can use body_* only)
#   body, body_en, body_ja: optional (Markdown); at least one of title/body/link should be set
#   link: optional URL (external or on this site). For an external announcement,
#     link the page the organisation maintains, not the PDF it happens to hold
#     today: those URLs carry a cache stamp (?cvid=...) and break on re-upload.
#   link_label_en, link_label_ja: optional; default "Read more" / 「詳細」
#   Style: given name only in English (Keisuke), family name + 君/さん in Japanese
#     (佐野君); ，。 punctuation. Students are named the way the lab speaks of them,
#     not the way a press release would.
items:
  - date: "2026-10-15"
    body_en: "Prof. Nakano gave a talk, \"Control design under constraints and safety guarantees,\" at the 2026 Industry-Academia Young Researchers' Seminar and Steelworks Tour, organized by the Young Researchers' Forum of the Instrumentation, Control and System Engineering Division, The Iron and Steel Institute of Japan."
    body_ja: "日本鉄鋼協会 計測・制御・システム工学部会 若手フォーラム主催の「2026年度 産学若手交流セミナーおよび製鉄所見学会」で，仲野が「制約を考慮した制御系設計と安全性保証」と題して発表しました。"
  - date: "2026-10-01"
    body_en: "Four new students, Genki, Yuto, Yoshihito, and Haruto, have joined the lab."
    body_ja: "新たに石渡君，小野木君，佐々木君，鳥居君の4名が研究室に配属されました。"
  - date: "2026-09-03"
    body_en: "Keisuke gave a talk at RSJ2026."
    body_ja: "佐野君が RSJ2026 で発表しました。"
  - date: "2026-08-26"
    body_en: "Our joint research project with Osaka University, \"Development of an omnidirectional, endlessly rotating mechanism free of singular configurations based on geometric power transmission,\" was selected for NEDO's Young Researcher Support Program (joint research formation track)."
    body_ja: "NEDO「官民による若手研究者発掘支援事業」の共同研究組成型に，大阪大学との共同研究課題「幾何学的動力伝達に基づく特異姿勢の無い全方向無限回転機構の開発」が採択されました。"
    link: "https://www.nedo.go.jp/koubo/SM3_100001_00119.html"
    link_label_en: "NEDO announcement"
    link_label_ja: "NEDO 公募ページ"
  - date: "2026-06-20"
    body_en: "Yuki gave a talk at ASCC 2026."
    body_ja: "堂高君が ASCC 2026 で発表しました。"
  - date: "2026-06-10"
    body_en: "The lab was awarded a laboratory infrastructure grant (electrical and electronic engineering) by the Murata Science and Education Foundation."
    body_ja: "村田学術振興・教育財団の研究室インフラ整備助成（電気・電子工学）に採択されました。"
    link: "https://corporate.murata.com/ja-jp/group/zaidan/requirement/grant-target"
    link_label_en: "Awardee list"
    link_label_ja: "採択者一覧"
  - date: "2026-04-24"
    body_en: "Yuki's paper has been accepted to ASCC 2026."
    body_ja: "堂高君の論文が ASCC 2026 に採択されました。"
  - date: "2026-04-24"
    body_en: "A group photo of lab members is now on the home page and in the sidebar."
    body_ja: "研究室メンバーの集合写真を，トップページと各ページのサイドバーに掲載しました。"
  - date: "2026-03-30"
    body_en: "The lab website is now public. Publications, members, and news will be updated here."
    body_ja: "研究室のウェブサイトを公開しました。論文・メンバー・お知らせなどを随時更新していきます。"
