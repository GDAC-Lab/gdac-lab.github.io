# Site settings. `jekyll serve` does not reload this file: restart it after an edit.

locale                   : "en-US"
title                    : "GDAC Lab"
# The suffix on Japanese page titles. English searches look for "GDAC Lab";
# Japanese ones look for 仲野研究室, and a title is the one line a search result
# always shows, so the Japanese pages say the name Japanese readers search for.
title_ja                 : "仲野研究室（GDAC Lab）"
# The masthead brand, where the full form breaks over two lines on a laptop and
# three on a phone. The parenthesis is what a wordmark can afford to drop: the
# title, the heading and the structured data all still carry it.
title_ja_short           : "仲野研究室"
title_separator          : "-"
name                     : &name "GDAC Lab"
# Fallback only: every content page carries a description of its own, in its own
# language. A page that reaches this line is showing English to a Japanese
# reader, so if one turns up in a search result, give that page a description.
description              : &description "Geometric Dynamics, Autonomy, and Control Laboratory, Nagoya Institute of Technology"
url                      : https://gdaclab.web.nitech.ac.jp # Must match the live host (see CNAME). Wrong host breaks absolute links and assets.
baseurl                  : "" # the subpath of your site, e.g. "/blog"
# Source for automated _publications (scripts/fetch_researchmap_publications.py)
researchmap_url          : "https://researchmap.jp/satoshi-nakano?lang=english"
# Listed in the structured data as another page about the same person, alongside
# researchmap and Pure. Leave blank rather than guess: a sameAs pointing at a
# 404 is worse than a shorter list.
nitech_faculty_url       : "https://www.nitech.ac.jp/faculty/nakano-satoshi.html"

# Site Author - The following control what appear as part of the author content on the side bar.
#               If a field is blank the icon and link will not appear, otherwise it will be shown.
#               Additional customization can be done by editing /_includes/author-profile.html
author:
  # Biographic information
  avatar           : "lab/group-photo.jpg" # Sidebar image (also the photo on the home page, _includes/home-photo.html)
  name             : "GDAC Lab"
  name_ja          : "仲野研究室"
  bio              : "Geometric Dynamics, Autonomy, and Control Laboratory"
  bio_ja           : "拘束を考慮した回転運動の制御と，衛星・ドローンへの応用を研究しています。"
  location         : "Nagoya, Japan"
  location_ja      : "名古屋"
  employer         : "Nagoya Institute of Technology"
  employer_ja      : "名古屋工業大学"
  # The PI's own page: a separate WordPress site, served from /nakano/ of this
  # same domain. Nothing in this repository builds it -- see README, "The
  # WordPress site at /nakano/". The old address
  # (mcontrol.web.nitech.ac.jp/nakano/) still answers and is on business cards,
  # so it is being kept for now; this is the one to link.
  uri              : "https://gdaclab.web.nitech.ac.jp/nakano/" # PI's personal page
  pure_url         : "https://pure.nitech.ac.jp/ja/persons/satoshi-nakano/" # PI profile (NITech Pure)
  # Email: plain `email` adds a mailto link in the sidebar. `email_image` is shown only on People (教員 block).
  email            : # used only if email_image is unset, for sidebar mailto
  # The address on the People page. As an image it is out of reach of address
  # harvesters, but also of automated checks that look for the address in the
  # page text. `email_as_text: true` prints it as text with a mailto link
  # instead; set it back to false to return to the image.
  email_text       : "nakano@nitech.ac.jp"
  email_as_text    : true
  # Raster under /images/ (path relative to /images/). Shown on /people/ and /ja/people/ only.
  email_image      : "nakano-email.png"

  # Names emphasised in publication author lists so a reader can find the lab's
  # own members at a glance (see _includes/publication-entry.html).
  highlight_names:
    - "Satoshi Nakano"
    - "仲野聡史"

  # Academic profiles and code, shown in the sidebar when set.
  googlescholar    : "https://scholar.google.com/citations?user=uUvDkIkAAAAJ&hl=en"
  googlescholar_ja : "https://scholar.google.com/citations?user=uUvDkIkAAAAJ&hl=ja"
  github           : "gdac-lab"

# Publication Category - The following the list of publication categories and their headings
publication_category:
  books:
    title: 'Books'
    title_ja: '著書'
  manuscripts:
    title: 'Journal articles'
    title_ja: '学術雑誌論文'
  conferences:
    title: 'Conference papers'
    title_ja: '会議論文'
  preprints:
    title: 'Preprints'
    title_ja: 'プレプリント'

# Publications index: only the last N calendar years are listed (inclusive). 0 lists every year,
# which is the setting here -- the list is short enough to read whole, and the year in each
# entry's left gutter keeps a long page navigable. With a window set, works from before it are
# left to researchmap_url, which the Publications page then points at.
publication_list_last_n_years: 0

# Publication records dated ahead of the build (a paper accepted for a later
# issue) are still built.
future                   : true


# SEO Related
# Search Console, https://gdaclab.web.nitech.ac.jp/ (URL prefix property).
# Not a secret: seo.html puts it in the head of every page, which is the point
# of it. Removing it un-verifies the property.
google_site_verification : "9R2JrmzriaDdkLuCmC8LwMKuFrELVBbz8avjXg3pWUg"
og_image                 : "lab/group-photo.jpg"  # shown when a link to this site is unfurled by a chat app or a social platform


# Reading files
include:
  - .htaccess
  - _pages
# Anything listed here is not copied into _site. Repo-only tooling and docs must
# stay listed: Jekyll 3 replaces its default list with this one rather than
# adding to it, so whatever is missing is published verbatim under the site root.
exclude:
  - .bundle
  - .github
  - .sass-cache
  # The CAD the browser demo's vehicle is built from. Kept in the repository
  # so scripts/build_drone_mesh.py can be re-run, but 8 MB of STL has no
  # business on the live site: only the built bundle beside it ships.
  - assets/models/wheeled-uav/meshes
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - node_modules
  - README.md
  - scripts
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"


# Markdown processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Publication records, written by the sync scripts (see README).
collections:
  publications:
    output: true
    permalink: /:collection/:path/


defaults:
  # The animation's viewer is a standalone page framed by /sun-safe-slew/, and
  # it carries a noindex meta tag. jekyll-sitemap picks up static .html files,
  # so keep it out: a sitemap entry for a noindex URL is a contradiction, and
  # the framing page is the one to list.
  - scope:
      path: "assets/demos"
    values:
      sitemap: false
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed


timezone: Etc/UTC


plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
