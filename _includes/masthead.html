{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist"><a href="{% if page.lang == 'ja' %}{{ base_path }}/ja/{% else %}{{ base_path }}/{% endif %}">{% if page.lang == 'ja' and site.title_ja_short %}{{ site.title_ja_short }}{% else %}{{ site.title }}{% endif %}</a></li>
          {%- comment -%}
            An entry with `children:` in navigation.yml becomes a menu. Its
            toggle is an <a role="button"> rather than a <button>, because
            greedy-nav claims every <button> inside #site-nav as its own
            overflow control. assets/js/nav-submenu.js opens and closes it.
          {%- endcomment -%}
          {% for link in site.data.navigation.main %}
            {% assign nav_label = link.title %}
            {% if page.lang == 'ja' and link.title_ja %}
              {% assign nav_label = link.title_ja %}
            {% endif %}
            {% if link.children %}
            <li class="masthead__menu-item masthead__menu-item--group">
              <div class="masthead__group">
                <a role="button" tabindex="0" aria-haspopup="true" aria-expanded="false" aria-controls="nav-group-{{ forloop.index }}" class="masthead__group-toggle">{{ nav_label }}<span class="masthead__group-caret" aria-hidden="true"></span></a>
                <ul class="masthead__submenu" id="nav-group-{{ forloop.index }}">
                  {% for child in link.children %}
                    {% assign child_label = child.title %}
                    {% if page.lang == 'ja' and child.title_ja %}
                      {% assign child_label = child.title_ja %}
                    {% endif %}
                    {% include nav-url.html url=child.url %}
                    <li><a href="{{ nav_url }}"{% if nav_external %} target="_blank" rel="noopener noreferrer"{% endif %}>{{ child_label }}</a></li>
                  {% endfor %}
                </ul>
              </div>
            </li>
            {% else %}
            {% include nav-url.html url=link.url %}
            <li class="masthead__menu-item"><a href="{{ nav_url }}"{% if nav_external %} target="_blank" rel="noopener noreferrer"{% endif %}>{{ nav_label }}</a></li>
            {% endif %}
          {% endfor %}
          {%- comment -%}
            Language switcher. Each page links to its counterpart in the other
            language; lang-urls.html works out which URL that is, and the hreflang
            links in the head read the same answer from it.
          {%- endcomment -%}
          {%- include lang-urls.html -%}
          <li class="masthead__menu-item persist">{% if lang_is_ja %}<a href="{{ base_path }}{{ lang_url_en }}" class="masthead__lang-link">{% include lang-flag.html code="gb" %}EN</a><span class="masthead__lang-sep">|</span><span class="masthead__lang-current">{% include lang-flag.html code="jp" %}日本語</span>{% else %}<span class="masthead__lang-current">{% include lang-flag.html code="gb" %}EN</span><span class="masthead__lang-sep">|</span><a href="{{ base_path }}{{ lang_url_ja }}" class="masthead__lang-link">{% include lang-flag.html code="jp" %}日本語</a>{% endif %}</li>
          <li id="theme-toggle" class="masthead__menu-item persist tail">
            <a role="button" aria-label="{% if page.lang == 'ja' %}表示テーマを切り替える{% else %}Toggle light and dark theme{% endif %}"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true" title="{% if page.lang == 'ja' %}表示テーマの切り替え{% else %}Toggle theme{% endif %}"></i></a>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
